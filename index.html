<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podskip</title>
<meta name="description" content="A podcast player that finds the ads and skips them for you.">
<meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Podskip">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap">
<link rel="stylesheet" href="app.css?v=7">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-in">
      <a class="wordmark" href="#listen" aria-label="Podskip home"><span class="splice" aria-hidden="true"></span>Podskip</a>
      <button class="scanpill" id="scanpill" type="button" hidden><span class="dot"></span><span id="scanpill-text">Up to date</span></button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>

  <div class="dock" id="dock">
    <button class="mini" id="mini" type="button" hidden>
      <img class="mini-art" id="mini-art" alt="">
      <span class="mini-text">
        <span class="mini-title" id="mini-title"></span>
        <span class="mini-sub" id="mini-sub"></span>
      </span>
      <span class="mini-play" id="mini-play" role="button" aria-label="Play"></span>
      <span class="mini-bar"><span id="mini-bar-fill"></span></span>
    </button>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#listen" data-tab="listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0v5a2 2 0 0 1-2 2h-1v-6h3M4 13v5a2 2 0 0 0 2 2h1v-6H4"/></svg>Listen</a>
      <a href="#shows" data-tab="shows"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Shows</a>
      <a href="#search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>Add</a>
      <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Settings</a>
    </nav>
  </div>

  <section class="player" id="player" aria-label="Now playing" hidden>
    <div class="player-in">
      <div class="player-top">
        <button class="icon-btn" id="player-close" type="button" aria-label="Close player"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="eyebrow">Now playing</span>
        <span class="icon-btn-spacer"></span>
      </div>
      <div class="player-head">
        <img class="player-art" id="p-art" alt="">
        <div class="player-titles">
          <div class="p-show" id="p-show"></div>
          <h2 class="p-title" id="p-title"></h2>
        </div>
      </div>
      <div class="p-actions" id="p-actions"></div>
      <div class="p-note" id="p-note" hidden></div>

      <div class="scrub">
        <div class="scrub-track" id="scrub-track" aria-hidden="true">
          <div class="scrub-buffer" id="scrub-buffer"></div>
          <div class="scrub-fill" id="scrub-fill"></div>
          <div class="scrub-ads" id="scrub-ads"></div>
          <div class="scrub-marks" id="scrub-marks"></div>
          <div class="scrub-knob" id="scrub-knob"></div>
        </div>
        <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <div class="scrub-times"><span id="t-now">0:00</span><span id="t-chapter" class="t-chapter"></span><span id="t-left">-0:00</span></div>
      </div>

      <div class="controls">
        <button class="ctl ctl-speed" id="c-speed" type="button" aria-label="Playback speed">1×</button>
        <button class="ctl" id="c-back" type="button" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M11 5 6 9l5 4"/><path d="M6.5 9H14a5 5 0 0 1 0 10h-3"/></svg><span>15</span></button>
        <button class="ctl ctl-play" id="c-play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13l11-6.5z"/></svg><svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg></button>
        <button class="ctl" id="c-fwd" type="button" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="m13 5 5 4-5 4"/><path d="M17.5 9H10a5 5 0 0 0 0 10h3"/></svg><span>30</span></button>
        <button class="ctl ctl-skipad" id="c-skipad" type="button" aria-label="Skip to end of this ad" disabled><svg viewBox="0 0 24 24"><path d="M5 6l8 6-8 6zM14 6l6 6-6 6"/></svg></button>
      </div>

      <div class="ptabs" role="tablist">
        <button role="tab" data-ptab="about" aria-selected="true" type="button">About</button>
        <button role="tab" data-ptab="chapters" aria-selected="false" type="button">Chapters</button>
        <button role="tab" data-ptab="ads" aria-selected="false" type="button">Ads</button>
        <button role="tab" data-ptab="transcript" aria-selected="false" type="button">Transcript</button>
      </div>
      <div class="ppane" id="ppane"></div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<audio id="audio" preload="metadata" playsinline></audio>
<script src="app.js?v=7"></script>
</body>
</html>
