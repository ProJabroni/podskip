name: Scan episodes

# Runs when the app asks for a scan, and every 3 hours to catch new episodes.
on:
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test notification"
        type: boolean
        default: false
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      PODSKIP_KEY: ${{ secrets.PODSKIP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'base.en' }}
      TEST_PUSH: ${{ inputs.test_push || false }}
    steps:
      - uses: actions/checkout@v5

      - name: Get your data
        id: data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --quiet --single-branch --branch data \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
            git -C data config user.name "podskip-bot"
            git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No data yet. Open the app and finish setup, then add a show."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.data.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Fix reported ads
        if: steps.data.outputs.ready == 'true'
        run: |
          pip install -q requests "cryptography>=43" pywebpush==2.0.3
          python scanner/scan.py --reports-only

      - name: Install
        if: steps.data.outputs.ready == 'true'
        run: |
          which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r scanner/requirements.txt

      - name: Reuse the speech model
        if: steps.data.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1

      - name: Scan
        if: steps.data.outputs.ready == 'true'
        run: python scanner/scan.py

      - name: Keep the data branch small
        if: steps.data.outputs.ready == 'true' && always()
        run: |
          cd data
          git fetch -q origin data
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/data)" ]; then
            echo "The app changed something just now; skipping cleanup this time."
            exit 0
          fi
          if [ "$(git rev-list --count HEAD)" -gt 30 ]; then
            old=$(git rev-parse HEAD)
            git checkout -q --orphan snapshot
            git commit -q -m "Data snapshot"
            git push -q --force-with-lease=data:$old origin snapshot:data \
              && echo "Squashed data history." || echo "Skipped squash (data changed)."
          fi
